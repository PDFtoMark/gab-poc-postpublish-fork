name: Release
on:
  pull_request:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: craft attacker-controlled artifact
        run: |
          printf 'v0.0.0-attacker-injected\n' > release-tag.data
      - uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-tag.data
